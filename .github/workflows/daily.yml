# 每日论文推送 — GitHub Actions 工作流
# UTC 22:00 = 北京时间 06:00
# 也可以在 Actions 页面手动触发测试

name: Daily Paper Digest

on:
  schedule:
    - cron: '0 22 * * *'    # UTC 22:00 = 北京 06:00
  workflow_dispatch:         # 允许手动触发（测试用）

permissions:
  contents: write            # 需要写权限来 commit 数据库文件

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily digest
        working-directory: src
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python main.py

      # 把更新后的 SQLite 数据库提交回 repo
      - name: Commit database updates
        run: |
          git config user.name "arxiv-daily-bot"
          git config user.email "bot@arxiv-daily"
          git add -f data/papers.db || true
          git diff --cached --quiet || git commit -m "📄 update paper database $(date -u +%Y-%m-%d)"
          git push
